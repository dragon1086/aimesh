    soul_file: "souls/researcher.md"
    capabilities: ["research", "analyze", "compare"]
    model: "sonnet"
    max_budget_usd: 3.0

pm:
  model: "claude-sonnet-4-20250514"
  tools_enabled: true

workspace_path: "./workspace"
